services:
  anpr-ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anpr_ocr_service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - DEVICE=auto
      - CONFIDENCE_THRESHOLD=0.85
      - PLATE_REGEX=^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}$$
      - DATABASE_URL=postgresql://anpr_user:anpr_secret@postgres:5432/anpr_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_TOPIC=anpr.detections
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - inference_logs:/app/logs/inferences

  postgres:
    image: postgres:16-alpine
    container_name: anpr_postgres
    environment:
      POSTGRES_USER: anpr_user
      POSTGRES_PASSWORD: anpr_secret
      POSTGRES_DB: anpr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr_user -d anpr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anpr_rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Web Management Console
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  pgdata:
  rabbitmq_data:
  inference_logs:
